name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tuinet.slnx

      # Directory.Build.props sets TreatWarningsAsErrors, so any warning fails the build.
      - name: Build
        run: dotnet build tuinet.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tuinet.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=${{ matrix.os }}"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  native-aot:
    name: Native AOT publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Trim/AOT analysis warnings are errors (TreatWarningsAsErrors), so this fails on any AOT regression.
      - name: Publish samples with Native AOT
        run: |
          for sample in Showcase Stress; do
            dotnet publish "samples/Tuinet.Samples.$sample" -c Release -p:PublishAot=true -o "publish/$sample"
          done
          ls -la publish/*/Tuinet.Samples.*
