name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tuinet.slnx

      # Known-vulnerable packages anywhere in the graph (tests and benchmarks included) fail the build. The command's
      # exit code doesn't say, so the report is checked for a finding ("has the following vulnerable packages" and a
      # "> package" row); once is enough, so only on Linux.
      - name: Check for vulnerable packages
        if: runner.os == 'Linux'
        run: |
          report="$(dotnet list tuinet.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "$report"
          if grep -q 'has the following vulnerable packages' <<<"$report" || grep -Eq '^\s*>\s' <<<"$report"; then
            echo "::error::Vulnerable packages found; see the report above"
            exit 1
          fi
          grep -q 'has no vulnerable packages' <<<"$report"   # the report must have run at all

      # Directory.Build.props sets TreatWarningsAsErrors, so any warning fails the build.
      - name: Build
        run: dotnet build tuinet.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tuinet.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=${{ matrix.os }}"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Packs the library and Tuinet.Testing the way release.yml does and inspects the result, so packaging breaks
  # show up in review rather than at release time.
  pack:
    name: Pack check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pack
        run: |
          dotnet pack src/Tuinet -c Release -p:VersionSuffix=ci.${{ github.run_number }} -o artifacts/packages
          dotnet pack src/Tuinet.Testing -c Release -p:VersionSuffix=ci.${{ github.run_number }} -o artifacts/packages

      - name: Verify package
        run: tools/pack/verify.sh artifacts/packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error

  native-aot:
    name: Native AOT publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Trim/AOT analysis warnings are errors (TreatWarningsAsErrors), so this fails on any AOT regression.
      - name: Publish samples with Native AOT
        run: |
          for sample in Showcase Stress Inline; do
            dotnet publish "samples/Tuinet.Samples.$sample" -c Release -p:PublishAot=true -o "publish/$sample"
          done
          ls -la publish/*/Tuinet.Samples.*

      # The samples in a real terminal implementation (tmux): navigation, editing, scrolling, grapheme
      # clusters, clean exit. Reuses the binaries published above.
      - name: End-to-end checks in tmux
        run: |
          command -v tmux || { sudo apt-get update -q && sudo apt-get install -y -q tmux; }
          tools/e2e/run.sh publish

  # The docs site (docs/, API reference from the XML docs) must build with no warnings: broken links,
  # bad cross-references and missing pages fail here rather than on the published site.
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the docs site
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      # The README and docs images must be what the apps draw today, rendered the same way twice.
      - name: Check the screenshots are deterministic and up to date
        run: dotnet run -c Release --project tools/screenshots -- --check
