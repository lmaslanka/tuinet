name: Release

# Pushing a v* tag releases that version: v0.1.0 is a stable release, v0.1.0-rc.1 a pre-release. The tag
# must match <VersionPrefix> in Directory.Build.props. Steps before tagging are in README › Releasing.
on:
  push:
    tags: ['v*']

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  pack:
    name: Build, test & pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix="${version%%-*}"
          expected="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          if [ "$prefix" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $expected in Directory.Build.props"
            exit 1
          fi
          prerelease=false
          [ "$version" != "$prefix" ] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Stable releases need a "## [x.y.z]" section; pre-releases fall back to "## [Unreleased]".
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          section() { awk -v h="## [$1]" 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } /^\[[^]]+\]: / { next } on' CHANGELOG.md; }
          notes="$(section "$VERSION")"
          if [ -z "$notes" ] && [ "$PRERELEASE" = true ]; then notes="$(section Unreleased)"; fi
          if [ -z "$(tr -d '[:space:]' <<<"$notes")" ]; then
            echo "::error::CHANGELOG.md has no notes for $VERSION"
            exit 1
          fi
          mkdir -p artifacts
          printf '%s\n' "$notes" > artifacts/release-notes.md
          cat artifacts/release-notes.md

      - name: Restore
        run: dotnet restore tuinet.slnx

      # The version comes from the tag name, which git lets contain shell metacharacters: it reaches the shell
      # through the environment, never by ${{ }} interpolation into the script.
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build tuinet.slnx -c Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test tuinet.slnx -c Release --no-build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for project in src/Tuinet src/Tuinet.Testing; do
            dotnet pack "$project" -c Release --no-build \
              -p:Version="$VERSION" \
              -o artifacts/packages
          done

      - name: Verify package
        run: tools/pack/verify.sh artifacts/packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            artifacts/packages/*
            artifacts/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to NuGet & GitHub
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment to gate releases. The nuget.org Trusted Publishing policy
    # is restricted to this workflow file and environment.
    environment: release
    permissions:
      contents: write
      id-token: write   # GitHub OIDC token, exchanged for a one-hour nuget.org API key

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: no stored API key. NUGET_USER is the nuget.org profile name (not the email).
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to the .nupkg is pushed to the symbol server automatically.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ needs.pack.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* \
            --title "v$VERSION" \
            --notes-file artifacts/release-notes.md \
            "${flags[@]}"
