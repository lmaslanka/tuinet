# The workflows pin every action to a commit SHA; Dependabot keeps the pins (and the NuGet graph) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # 2.2.0 and later fail the build without a Six Labors license key (tools/screenshots).
      - dependency-name: "SixLabors.Fonts"
        versions: [">= 2.2.0"]
