- h2: Examples
- markdown: >-
    <pre><code class="lang-csharp">var popup = new Popup { Block = new Block { Title = " confirm ", Style = dialog }, Shadow = true, Padding = 1 };

    Rect area = frame.Area.Centered(popup.Outer(40, 3));

    frame.Render(popup, area);

    Rect inner = popup.Inner(area);</code></pre>
