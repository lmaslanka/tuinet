metadata:
  description: >-
    Bars that compare values, with eighth-block ends.  bars grow up from the bottom,
     wide, with the label under each bar and the value above it (inside its top when the bar is
    full height).  bars grow right, one row each, after a label column as wide as the

    widest label (at most a third of the width), with the value after the bar. Bars that don't fit are dropped from

    the end. Zero, negative and NaN values draw no bar; values over  are clamped.
