- markdown: >-
    Draw a scrollbar in the rightmost column; text wraps one column narrower while it shows. Measuring the

    text costs a pass over it per frame. Clicks map to a <xref href="Tuinet.Widgets.Paragraph.Scroll" data-throw-if-not-resolved="false"></xref> with

    <xref href="Tuinet.Widgets.Scrollbar.PositionAt(Tuinet.Rect%2cSystem.Int32%2cSystem.Int32%2cSystem.Int32%2cSystem.Int32%2cTuinet.Direction)" data-throw-if-not-resolved="false"></xref> over that column.
