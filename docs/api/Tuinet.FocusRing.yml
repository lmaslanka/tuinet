- markdown: >-
    Which of <xref href="Tuinet.FocusRing.Count" data-throw-if-not-resolved="false"></xref> controls has focus, as an index that wraps around: Tab and Shift+Tab move it, and a

    click on a control focuses it. A plain value kept in your state; widgets still take <code>Focused = ring.Is(i)</code>.


    <pre><code class="lang-csharp">var focus = new FocusRing(3);                        // name, notify, Save

    if (ev.Kind == EventKind.Key &amp;&amp; focus.Handle(ev.Key)) return;

    frame.Render(new Button("Save") { Focused = focus.Is(2) }, saveArea);</code></pre>
