metadata:
  description: >-
    Which of  controls has focus, as an index that wraps around: Tab and Shift+Tab move it, and a

    click on a control focuses it. A plain value kept in your state; widgets still take Focused = ring.Is(i).


    var focus = new FocusRing(3);                        // name, notify, Save

    if (ev.Kind == EventKind.Key &amp;&amp; focus.Handle(ev.Key)) return;

    frame.Render(new Button("Save") { Focused = focus.Is(2) }, saveArea);
