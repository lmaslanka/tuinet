- markdown: >-
    Builds a <xref href="Tuinet.StyledText" data-throw-if-not-resolved="false"></xref> into caller memory (usually <code>stackalloc</code>), merging adjacent runs

    with the same style. Never throws when full: what fits is kept and <xref href="Tuinet.StyledTextBuilder.Overflowed" data-throw-if-not-resolved="false"></xref> is set.


    <pre><code class="lang-csharp">var keys = new StyledTextBuilder(stackalloc char[64], stackalloc StyledRun[8]);

    keys.Append("j/k", key);

    keys.Append(" move  ", dim);

    keys.Append(count, key);

    buffer.SetText(x, y, keys.Build());</code></pre>
