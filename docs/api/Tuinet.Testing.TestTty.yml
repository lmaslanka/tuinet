  metadata:
    uid: Tuinet.Testing.TestTty.TakeSignals
    commentId: M:Tuinet.Testing.TestTty.TakeSignals
- markdown: >-
    Job-control signals from outside the app since the last call; called on every poll, so it must be

    cheap. Before reporting <xref href="Tuinet.TtySignals.Continued" data-throw-if-not-resolved="false"></xref>, re-apply raw mode.
- code: public TtySignals TakeSignals()
