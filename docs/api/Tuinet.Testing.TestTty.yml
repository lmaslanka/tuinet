  id: Tuinet_Testing_TestTty_Suspend
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Testing/TestTty.cs#L144
  metadata:
    uid: Tuinet.Testing.TestTty.Suspend
    commentId: M:Tuinet.Testing.TestTty.Suspend
- markdown: >-
    Restore the original modes, stop the process until it is continued (e.g. the shell's <code>fg</code>), then

    re-enter raw mode. Called only when <xref href="Tuinet.ITty.CanSuspend" data-throw-if-not-resolved="false"></xref>; <xref href="Tuinet.Terminal" data-throw-if-not-resolved="false"></xref> writes the

    leave and enter sequences around it.
