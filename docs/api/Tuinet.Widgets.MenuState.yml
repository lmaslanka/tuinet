- api3: Handle(KeyEvent, ReadOnlySpan<MenuItem>)
  id: Tuinet_Widgets_MenuState_Handle_Tuinet_KeyEvent_System_ReadOnlySpan_Tuinet_Widgets_MenuItem__
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Widgets/Menu.cs#L84
  metadata:
    uid: Tuinet.Widgets.MenuState.Handle(Tuinet.KeyEvent,System.ReadOnlySpan{Tuinet.Widgets.MenuItem})
    commentId: M:Tuinet.Widgets.MenuState.Handle(Tuinet.KeyEvent,System.ReadOnlySpan{Tuinet.Widgets.MenuItem})
- markdown: >-
    Up/Down (and k/j) move to the previous or next selectable item, wrapping; Home/End go to the first or last;

    Enter or Space activates; Esc cancels; an item's mnemonic letter activates it. j and k always move, so don't

    use them as mnemonics. Other keys are <xref href="Tuinet.Widgets.MenuResult.Unhandled" data-throw-if-not-resolved="false"></xref>.
