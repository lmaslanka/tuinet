- api3: HandleMouse(MouseEvent, ReadOnlySpan<MenuItem>)
  id: Tuinet_Widgets_MenuState_HandleMouse_Tuinet_MouseEvent_System_ReadOnlySpan_Tuinet_Widgets_MenuItem__
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Widgets/Menu.cs#L143
  metadata:
    uid: Tuinet.Widgets.MenuState.HandleMouse(Tuinet.MouseEvent,System.ReadOnlySpan{Tuinet.Widgets.MenuItem})
    commentId: M:Tuinet.Widgets.MenuState.HandleMouse(Tuinet.MouseEvent,System.ReadOnlySpan{Tuinet.Widgets.MenuItem})
- markdown: >-
    A click on an item activates it; the pointer moving over one highlights it (needs

    <xref href="Tuinet.TerminalOptions.MouseMotion" data-throw-if-not-resolved="false"></xref>, or a held button); the wheel scrolls a menu that doesn't fit. A

    press anywhere outside <xref href="Tuinet.Widgets.MenuState.Area" data-throw-if-not-resolved="false"></xref> is <xref href="Tuinet.Widgets.MenuResult.Cancelled" data-throw-if-not-resolved="false"></xref>, and the caller can still act

    on it (e.g. a right-click elsewhere opens the menu there).
