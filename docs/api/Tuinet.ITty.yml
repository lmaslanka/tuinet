- api3: Restore()
  id: Tuinet_ITty_Restore
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/ITty.cs#L25
  metadata:
    uid: Tuinet.ITty.Restore
    commentId: M:Tuinet.ITty.Restore
- markdown: Restore the terminal's original modes (termios / console modes). Idempotent; must not throw.
- code: void Restore()
- api3: Suspend()
  id: Tuinet_ITty_Suspend
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/ITty.cs#L35
  metadata:
    uid: Tuinet.ITty.Suspend
    commentId: M:Tuinet.ITty.Suspend
- markdown: >-
    Restore the original modes, stop the process until it is continued (e.g. the shell's <code>fg</code>), then

    re-enter raw mode. Called only when <xref href="Tuinet.ITty.CanSuspend" data-throw-if-not-resolved="false"></xref>; <xref href="Tuinet.Terminal" data-throw-if-not-resolved="false"></xref> writes the

    leave and enter sequences around it.
- code: void Suspend()
- api3: TakeSignals()
  id: Tuinet_ITty_TakeSignals
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/ITty.cs#L43
  metadata:
    uid: Tuinet.ITty.TakeSignals
    commentId: M:Tuinet.ITty.TakeSignals
- markdown: >-
    Job-control signals from outside the app since the last call; called on every poll, so it must be

    cheap. Before reporting <xref href="Tuinet.TtySignals.Continued" data-throw-if-not-resolved="false"></xref>, re-apply raw mode.
- code: TtySignals TakeSignals()
