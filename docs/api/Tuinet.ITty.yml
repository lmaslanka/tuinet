    commentId: P:Tuinet.ITty.CanSuspend
- markdown: Whether <xref href="Tuinet.ITty.Suspend" data-throw-if-not-resolved="false"></xref> can stop the process (Unix job control). False by default.
- code: bool CanSuspend { get; }
