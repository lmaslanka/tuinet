- api3: Read(Span<byte>, int)
  id: Tuinet_ITty_Read_System_Span_System_Byte__System_Int32_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/ITty.cs#L19
  metadata:
    uid: Tuinet.ITty.Read(System.Span{System.Byte},System.Int32)
    commentId: M:Tuinet.ITty.Read(System.Span{System.Byte},System.Int32)
- markdown: >-
    Wait up to <code class="paramref">timeoutMs</code> (-1 = forever, 0 = don't wait) for input and read it.

    Returns 0 on timeout, on <xref href="Tuinet.ITty.Wake" data-throw-if-not-resolved="false"></xref>, or when the size may have changed.
- code: int Read(Span<byte> buffer, int timeoutMs)
