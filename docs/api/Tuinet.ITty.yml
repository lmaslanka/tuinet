  metadata:
    uid: Tuinet.ITty.Wake
    commentId: M:Tuinet.ITty.Wake
- markdown: Make a blocked <xref href="Tuinet.ITty.Read(System.Span%7bSystem.Byte%7d%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> return now. Callable from any thread.
- code: void Wake()
