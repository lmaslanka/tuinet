- markdown: >-
    A one-row tab bar: titles with padding, separated by <xref href="Tuinet.Widgets.Tabs.Divider" data-throw-if-not-resolved="false"></xref>. When they don't fit, it scrolls

    to keep the selected tab visible and shows ‹ › where tabs are hidden. Only the tabs are drawn; the rest of the

    row is left as it is, so the bar can sit in a <xref href="Tuinet.Widgets.Block" data-throw-if-not-resolved="false"></xref>'s top border.
- code: 'public readonly ref struct Tabs : IStatefulWidget<TabsState>'
