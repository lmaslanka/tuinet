- markdown: >-
    A one-shot "at this time" check for time-based changes (hide a message after 3 s, debounce a search) without timers

    or callbacks. Keep it in your state, check it with the loop's time, and return <xref href="Tuinet.Alarm.DueMs" data-throw-if-not-resolved="false"></xref> from

    <xref href="Tuinet.IApp.NextDueMs(System.Int64)" data-throw-if-not-resolved="false"></xref> so <xref href="Tuinet.Terminal.Run(Tuinet.IApp%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> wakes for it. <code>default</code> is not set.


    <pre><code class="lang-csharp">flashAlarm.Start(nowMs, 3000);                     // when the message is shown

    if (flashAlarm.Fire(nowMs)) flash = "";            // in Handle: true once, when due

    public long NextDueMs(long nowMs) =&gt; flashAlarm.DueMs;</code></pre>
