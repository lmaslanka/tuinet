- h2: Remarks
- markdown: >-
    The two spans draw an app-owned ring buffer without a copy: pass the older part, then the newer part.

    Only cells with a block are written, so <xref href="Tuinet.Widgets.Sparkline.Style" data-throw-if-not-resolved="false"></xref>'s background shows only behind the bars.
