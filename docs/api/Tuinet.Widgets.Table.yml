- markdown: >-
    Widest cell of <code class="paramref">column</code> (and <code class="paramref">header</code>) over the first

    <code class="paramref">maxRows</code> rows. O(rows): call it when the data changes and cache the result as

    <xref href="Tuinet.Constraint.Length(System.Int32)" data-throw-if-not-resolved="false"></xref>, not every frame. Add 2 for a column that shows a sort arrow.
