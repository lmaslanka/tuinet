- api3: ScrollRegions
  id: Tuinet_TerminalOptions_ScrollRegions
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/TerminalOptions.cs#L84
  metadata:
    uid: Tuinet.TerminalOptions.ScrollRegions
    commentId: P:Tuinet.TerminalOptions.ScrollRegions
- markdown: >-
    When a band of full-width rows scrolls, let the terminal move them (scroll margins plus

    insert/delete line) instead of repainting every row. On terminals that report left/right margins (DECLRMM,

    asked at startup; see <xref href="Tuinet.Terminal.LeftRightMarginsActive" data-throw-if-not-resolved="false"></xref>) bands narrower than the screen move too,

    such as a list beside a panel. Turn off for a terminal that mishandles them.
- code: public bool ScrollRegions { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
- api3: SuspendOnCtrlZ
  id: Tuinet_TerminalOptions_SuspendOnCtrlZ
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/TerminalOptions.cs#L98
  metadata:
    uid: Tuinet.TerminalOptions.SuspendOnCtrlZ
    commentId: P:Tuinet.TerminalOptions.SuspendOnCtrlZ
- markdown: >-
    Handle Ctrl+Z inside <xref href="Tuinet.Terminal.Poll(Tuinet.Event%40%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> by calling <xref href="Tuinet.Terminal.Suspend" data-throw-if-not-resolved="false"></xref>, so the app can

    be backgrounded like a shell command. Off by default: Ctrl+Z is a normal key. Where suspending isn't

    supported (Windows) the key is delivered as usual.
- code: public bool SuspendOnCtrlZ { get; init; }
