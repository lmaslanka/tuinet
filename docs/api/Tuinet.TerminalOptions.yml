- api3: KeyReleaseEvents
  id: Tuinet_TerminalOptions_KeyReleaseEvents
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/TerminalOptions.cs#L70
  metadata:
    uid: Tuinet.TerminalOptions.KeyReleaseEvents
    commentId: P:Tuinet.TerminalOptions.KeyReleaseEvents
- markdown: >-
    With <xref href="Tuinet.TerminalOptions.KittyKeyboard" data-throw-if-not-resolved="false"></xref>: also report key repeats and releases (<xref href="Tuinet.KeyEvent.Kind" data-throw-if-not-resolved="false"></xref>), e.g. for

    hold-to-move. Releases never match <xref href="Tuinet.KeyEvent.Is(Tuinet.KeyCode%2cTuinet.Modifiers)" data-throw-if-not-resolved="false"></xref>, <xref href="Tuinet.KeyEvent.IsChar(System.Char)" data-throw-if-not-resolved="false"></xref> or

    <xref href="Tuinet.KeyEvent.IsCtrl(System.Char)" data-throw-if-not-resolved="false"></xref>, but code reading <xref href="Tuinet.KeyEvent.Code" data-throw-if-not-resolved="false"></xref> directly must check the kind.
- code: public bool KeyReleaseEvents { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
- api3: KittyKeyboard
  id: Tuinet_TerminalOptions_KittyKeyboard
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/TerminalOptions.cs#L63
  metadata:
    uid: Tuinet.TerminalOptions.KittyKeyboard
    commentId: P:Tuinet.TerminalOptions.KittyKeyboard
- markdown: >-
    Ask the terminal for the kitty keyboard protocol (kitty, Ghostty, foot, WezTerm, recent Alacritty and iTerm2):

    keys that legacy encoding can't tell apart arrive distinct (Ctrl+I vs Tab, Ctrl+M vs Enter, Ctrl+[ vs Esc,

    Ctrl+Shift+letter), and Esc arrives at once instead of after <xref href="Tuinet.TerminalOptions.EscapeTimeoutMs" data-throw-if-not-resolved="false"></xref>. Terminals without

    it ignore the request; <xref href="Tuinet.Terminal.KittyKeyboardActive" data-throw-if-not-resolved="false"></xref> says whether it took effect.
- code: public bool KittyKeyboard { get; init; }
- h4: Property Value
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
