- api3: EraseSequences
  id: Tuinet_TerminalOptions_EraseSequences
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/TerminalOptions.cs#L91
  metadata:
    uid: Tuinet.TerminalOptions.EraseSequences
    commentId: P:Tuinet.TerminalOptions.EraseSequences
- markdown: >-
    Clear runs of blank cells with erase sequences (EL to the end of a row, ECH inside it) instead of writing

    spaces, when that is fewer bytes. Erased cells take the current background color (BCE), which modern

    terminals support; turn off for one that doesn't.
- code: public bool EraseSequences { get; init; }
