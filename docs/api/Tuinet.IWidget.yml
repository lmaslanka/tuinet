- markdown: >-
    An immediate-mode widget: a value describing what to draw, rendered into an area of a buffer.

    Widgets hold no state between frames; implement them as <code>readonly ref struct</code>s so they can

    carry spans (e.g. <code>stackalloc</code>-formatted text) at zero allocation cost.
