- api3: Handle(KeyEvent)
  id: Tuinet_Widgets_TextInputState_Handle_Tuinet_KeyEvent_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Widgets/TextInput.cs#L35
  metadata:
    uid: Tuinet.Widgets.TextInputState.Handle(Tuinet.KeyEvent)
    commentId: M:Tuinet.Widgets.TextInputState.Handle(Tuinet.KeyEvent)
- markdown: >-
    Apply an editing key. Returns false if the key is not an editing key (e.g. Tab, Enter, Up). On top of the

    shared keys (see <xref href="Tuinet.Widgets.EditableText" data-throw-if-not-resolved="false"></xref>): Home/End (Shift selects), Ctrl+A/E/B/F, Ctrl+U/K/W/D and

    Alt+B/F/D.
- code: public bool Handle(KeyEvent key)
