    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
- api3: HandleMouse(MouseEvent)
  id: Tuinet_Widgets_TextInputState_HandleMouse_Tuinet_MouseEvent_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Widgets/TextInput.cs#L84
  metadata:
    uid: Tuinet.Widgets.TextInputState.HandleMouse(Tuinet.MouseEvent)
    commentId: M:Tuinet.Widgets.TextInputState.HandleMouse(Tuinet.MouseEvent)
- markdown: >-
    A click on the input moves the caret to the clicked cluster (or the end, past the text), as the last render

    showed it, so clicking an unfocused input works too. Shift+click selects to there, and dragging selects.

    Returns whether the event was used.
- code: public bool HandleMouse(MouseEvent ev)
