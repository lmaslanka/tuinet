- api3: Handle(KeyEvent)
  id: Tuinet_Widgets_TextAreaState_Handle_Tuinet_KeyEvent_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Widgets/TextArea.cs#L84
  metadata:
    uid: Tuinet.Widgets.TextAreaState.Handle(Tuinet.KeyEvent)
    commentId: M:Tuinet.Widgets.TextAreaState.Handle(Tuinet.KeyEvent)
- markdown: >-
    Apply an editing key. Returns false for keys left to the app (Tab, Esc, Ctrl+Enter, Ctrl+↑…). On top of the

    shared keys (see <xref href="Tuinet.Widgets.EditableText" data-throw-if-not-resolved="false"></xref>): Enter inserts a line break, ↑/↓ and PageUp/PageDown move by

    screen rows keeping the column, Home/End go to the line's start/end (with Ctrl, the text's), Shift selects,

    and Ctrl+A selects all.
- code: public bool Handle(KeyEvent key)
