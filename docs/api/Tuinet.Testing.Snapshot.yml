- markdown: >-
    Compare <code class="paramref">buffer</code> with snapshot <code class="paramref">name</code>: as <xref href="Tuinet.Testing.CellBufferTesting.ToStyledString(Tuinet.CellBuffer)" data-throw-if-not-resolved="false"></xref>

    when <code class="paramref">styled</code> (colors and attributes count), else as plain text (<xref href="Tuinet.CellBuffer.ToString" data-throw-if-not-resolved="false"></xref>).

    Trailing spaces and blank lines are ignored. Snapshots live in <code class="paramref">directory</code>, by default a

    <code>__snapshots__</code> folder next to the calling test's source file.
