- markdown: Job-control signals an <xref href="Tuinet.ITty" data-throw-if-not-resolved="false"></xref> reports to <xref href="Tuinet.Terminal" data-throw-if-not-resolved="false"></xref>.
- code: >-
    [Flags]

    public enum TtySignals : byte
- h2: Fields
- parameters:
  - name: Continued
    default: "2"
    description: >+
      The process continued after a stop it didn't make itself (e.g. SIGSTOP then <code>fg</code>); the terminal re-enters and repaints.

  - name: None
    default: "0"
  - name: StopRequested
    default: "1"
    description: >+
      Something asked the app to stop (SIGTSTP, e.g. <code>kill -TSTP</code>); the terminal suspends on the next poll.

