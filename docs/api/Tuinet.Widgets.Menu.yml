- markdown: >-
    <pre><code class="lang-csharp">Rect box = frame.Area.PlaceNear(new Rect(mouse.X, mouse.Y, 0, 0), Menu.Measure(items));

    frame.Render(new Menu(items) { Popup = popup, SelectedStyle = highlight }, box, ref menu);</code></pre>
