  - name: Activated
    default: "2"
    description: >+
      <xref href="Tuinet.Widgets.MenuState.Selected" data-throw-if-not-resolved="false"></xref> was chosen: run it and close the menu.

  - name: Cancelled
    default: "3"
    description: >+
      Esc, or a click outside the menu: close it. For a click, the caller can still act on it.

  - name: Handled
    default: "1"
    description: >+
      Used (the highlight moved, the list scrolled, a disabled item was clicked).

  - name: Unhandled
    default: "0"
    description: >+
      Not a menu event: route it on.

