- api3: ToStyledString(CellBuffer)
  id: Tuinet_Testing_CellBufferTesting_ToStyledString_Tuinet_CellBuffer_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Testing/CellBufferTesting.cs#L25
  metadata:
    uid: Tuinet.Testing.CellBufferTesting.ToStyledString(Tuinet.CellBuffer)
    commentId: M:Tuinet.Testing.CellBufferTesting.ToStyledString(Tuinet.CellBuffer)
- markdown: >-
    The buffer as <xref href="Tuinet.Markup" data-throw-if-not-resolved="false"></xref>, one line per row: text in the default style is plain, styled text is

    wrapped in a tag, e.g. <code>[fg=#F5A623 b]ITEMS[/]</code>, and a literal <code>[</code> is <code>[[</code>. When a row is mostly

    one style with a background (a panel), that style opens the row and tags inside it hold only what differs. Stable, so

    it suits snapshot files (see <xref href="Tuinet.Testing.Snapshot" data-throw-if-not-resolved="false"></xref>), and <xref href="Tuinet.Testing.Snapshot.Parse(System.String)" data-throw-if-not-resolved="false"></xref> reads it back exactly.

    Rows are full width, like <xref href="Tuinet.CellBuffer.ToString" data-throw-if-not-resolved="false"></xref>. Hyperlinks and the cursor aren't included.
- code: public static string ToStyledString(this CellBuffer buffer)
