- api3: ToAnsi(CellBuffer)
  id: Tuinet_Testing_CellBufferTesting_ToAnsi_Tuinet_CellBuffer_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Testing/CellBufferTesting.cs#L101
  metadata:
    uid: Tuinet.Testing.CellBufferTesting.ToAnsi(Tuinet.CellBuffer)
    commentId: M:Tuinet.Testing.CellBufferTesting.ToAnsi(Tuinet.CellBuffer)
- markdown: >-
    The buffer as ANSI text (SGR colors and attributes, 24-bit where the cell is), one line per row, each ending

    with a reset. Print it to look at a frame in a real terminal: <code>Console.WriteLine(buffer.ToAnsi())</code>.
