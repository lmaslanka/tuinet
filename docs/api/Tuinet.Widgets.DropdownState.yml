- api3: HandleMouse(MouseEvent, int)
  id: Tuinet_Widgets_DropdownState_HandleMouse_Tuinet_MouseEvent_System_Int32_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Widgets/Dropdown.cs#L89
  metadata:
    uid: Tuinet.Widgets.DropdownState.HandleMouse(Tuinet.MouseEvent,System.Int32)
    commentId: M:Tuinet.Widgets.DropdownState.HandleMouse(Tuinet.MouseEvent,System.Int32)
- markdown: >-
    Closed: a click on the field opens. Open: a click on an item commits it, the wheel scrolls the list, a

    click on the field or anywhere else cancels. Returns whether the event was used; a click elsewhere closes

    the list but returns false, so the caller can still act on it (e.g. focus what was clicked).
