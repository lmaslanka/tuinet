- markdown: >-
    Draws a <xref href="Tuinet.Widgets.TextAreaState" data-throw-if-not-resolved="false"></xref>: the lines in view, soft-wrapped or scrolled sideways, with optional line

    numbers, a placeholder, and when <xref href="Tuinet.Widgets.TextArea.Focused" data-throw-if-not-resolved="false"></xref> the selection and the real terminal cursor at the caret.

    Only visible lines are measured.
