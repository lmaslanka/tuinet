metadata:
  description: >-
    A small markup for styled text, parsed into caller memory without allocating.


    [b] bold, [dim], [i] italic, [u] underline, [blink], [reverse],

    [hidden], [s] strike (long names work too: [bold], [italic], …).[fg=red], [bg=#1C2433]: a name (black … white, bright-red …,

    default), #RRGGBB, or a palette index 0–255. A bare color name or #RRGGBB sets the

    foreground; a bare number is just text.Several in one tag: [b fg=#F5A623]. [/] closes the latest tag.[[ is a literal [. A tag that doesn't parse is kept as text, so [1/3] needs no escaping.
