  id: Tuinet_Rect_PlaceNear_Tuinet_Rect_Tuinet_Size_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Rect.cs#L67
  metadata:
    uid: Tuinet.Rect.PlaceNear(Tuinet.Rect,Tuinet.Size)
    commentId: M:Tuinet.Rect.PlaceNear(Tuinet.Rect,Tuinet.Size)
- markdown: >-
    Where to open a popup of <code class="paramref">size</code> next to <code class="paramref">anchor</code> inside these bounds

    (usually the screen): below it if it fits, else above if it fits there, else on the side with more room,

    cut to fit. It starts at the anchor's left edge, moved left to stay inside. A 0×0 anchor is a point,

    e.g. the mouse pointer for a context menu.
