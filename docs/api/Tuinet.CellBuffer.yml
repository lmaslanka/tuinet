- markdown: >-
    Write styled text, like <xref href="Tuinet.CellBuffer.SetString(System.Int32%2cSystem.Int32%2cSystem.ReadOnlySpan%7bSystem.Char%7d%2cTuinet.Style%2cSystem.Int32%2cTuinet.Overflow)" data-throw-if-not-resolved="false"></xref> but with a style per run (layered over the text's base

    style, and over the cells underneath like any text write). Stops at the first glyph that doesn't fit.

    A run boundary inside a grapheme cluster moves to the cluster's end. With

    <xref href="Tuinet.Overflow.Ellipsis" data-throw-if-not-resolved="false"></xref>, the '…' takes the style of the text it replaces.
