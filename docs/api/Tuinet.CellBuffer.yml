- api3: SetLink(Rect, ReadOnlySpan<char>)
  id: Tuinet_CellBuffer_SetLink_Tuinet_Rect_System_ReadOnlySpan_System_Char__
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/CellBuffer.cs#L155
  metadata:
    uid: Tuinet.CellBuffer.SetLink(Tuinet.Rect,System.ReadOnlySpan{System.Char})
    commentId: M:Tuinet.CellBuffer.SetLink(Tuinet.Rect,System.ReadOnlySpan{System.Char})
- markdown: >-
    Make the cells in <code class="paramref">area</code> a hyperlink to <code class="paramref">url</code> (OSC 8): terminals that

    support it open the URL on click (often Ctrl+click), others show the text as is. Draw the text first: text

    written over a cell later replaces its link, as it does its attributes; <xref href="Tuinet.CellBuffer.SetStyle(Tuinet.Rect%2cTuinet.Style)" data-throw-if-not-resolved="false"></xref> keeps it.

    An empty <code class="paramref">url</code> removes links. Returns false, removing links instead, for a URL that can't

    be linked: one with control characters, longer than 2048 chars once encoded, or past the 4095th distinct URL

    of the process. Spaces and non-ASCII characters are percent-encoded.


    <pre><code class="lang-csharp">int end = buffer.SetString(x, y, "docs", linkStyle);

    buffer.SetLink(new Rect(x, y, end - x, 1), "https://example.com/docs");</code></pre>
