    commentId: M:Tuinet.Terminal.SetTitle(System.ReadOnlySpan{System.Char})
- markdown: >-
    Set the window (or tab) title (OSC 2). Control characters are dropped. The terminal's own title comes back on

    exit where it supports the title stack (<code>CSI 22 t</code> / <code>CSI 23 t</code>). Cheap to call every frame: only a

    change is sent.
