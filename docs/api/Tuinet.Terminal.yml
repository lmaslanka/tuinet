- api3: Suspend()
  id: Tuinet_Terminal_Suspend
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/Terminal.cs#L332
  metadata:
    uid: Tuinet.Terminal.Suspend
    commentId: M:Tuinet.Terminal.Suspend
- markdown: >-
    Leave the screen, restore the terminal and stop the process (Unix job control, as Ctrl+Z does in a

    shell command). Returns once the process is continued (e.g. <code>fg</code>), back on the alternate screen;

    the next <xref href="Tuinet.Terminal.Poll(Tuinet.Event%40%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> returns a <xref href="Tuinet.EventKind.Resize" data-throw-if-not-resolved="false"></xref> event so the app draws a frame,

    which repaints everything. Returns false, doing nothing, where suspending isn't supported (Windows).


    <pre><code class="lang-csharp">if (ev.Key.IsCtrl('z')) term.Suspend();</code></pre>


    See also <xref href="Tuinet.TerminalOptions.SuspendOnCtrlZ" data-throw-if-not-resolved="false"></xref>.
- code: public bool Suspend()
- h4: Returns
- parameters:
  - type:
    - text: bool
      url: https://learn.microsoft.com/dotnet/api/system.boolean
languageId: csharp
