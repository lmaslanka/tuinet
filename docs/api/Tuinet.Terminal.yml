- api3: Run(IApp, int)
  id: Tuinet_Terminal_Run_Tuinet_IApp_System_Int32_
  src: https://github.com/lmaslanka/tuinet/blob/main/src/Tuinet/App.cs#L50
  metadata:
    uid: Tuinet.Terminal.Run(Tuinet.IApp,System.Int32)
    commentId: M:Tuinet.Terminal.Run(Tuinet.IApp,System.Int32)
- markdown: >-
    Run <code class="paramref">app</code> until its <xref href="Tuinet.IApp.Handle(Tuinet.Event%2cSystem.Int64)" data-throw-if-not-resolved="false"></xref> returns false: draw a frame, sleep until input

    (or the next animation frame, or <xref href="Tuinet.IApp.NextDueMs(System.Int64)" data-throw-if-not-resolved="false"></xref>), handle every event already waiting, draw once.

    A burst of key repeats costs one frame, and an idle app costs nothing. In inline mode, the last frame is drawn

    again after the app stops, since it stays on screen. Allocates nothing per frame; apps that need something

    else can keep writing their own loop with <xref href="Tuinet.Terminal.Poll(Tuinet.Event%40%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>, <xref href="Tuinet.Terminal.BeginFrame" data-throw-if-not-resolved="false"></xref> and <xref href="Tuinet.Terminal.Present" data-throw-if-not-resolved="false"></xref>.


    <pre><code class="lang-csharp">using var term = Terminal.Open();
        term.Run(new MyApp());</code></pre>
- code: public void Run(IApp app, int frameMs = 33)
- h4: Parameters
- parameters:
  - name: app
    type:
    - text: IApp
      url: Tuinet.IApp.html
    description: Handles events and draws frames.
  - name: frameMs
    type:
    - text: int
      url: https://learn.microsoft.com/dotnet/api/system.int32
    description: Time between frames while <xref href="Tuinet.IApp.IsAnimating(System.Int64)" data-throw-if-not-resolved="false"></xref>; 0 draws as fast as the terminal takes them.
    optional: true
