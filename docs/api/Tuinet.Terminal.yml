- markdown: >-
    Copy <code class="paramref">text</code> to the system clipboard through the terminal (OSC 52), which also works over SSH.

    Returns false, sending nothing, when it is longer than <xref href="Tuinet.Terminal.MaxClipboardBytes" data-throw-if-not-resolved="false"></xref> in UTF-8. Terminals may

    ignore it or ask the user first (it's often off by default, e.g. in tmux without <code>set-clipboard on</code>);

    there is no reply saying whether it worked.
