- h4: Remarks
- markdown: >-
    Called only for the root and expanded nodes, so a lazy source (a file tree) loads a node's children the
        first time it is opened. If loading is async, return 0 until the data arrives, then call <xref href="Tuinet.Widgets.TreeState.Invalidate" data-throw-if-not-resolved="false"></xref>.
