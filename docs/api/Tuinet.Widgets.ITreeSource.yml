- markdown: >-
    A hierarchy for a <xref href="Tuinet.Widgets.TreeView%601" data-throw-if-not-resolved="false"></xref>: app-owned data addressed by integer node ids the app chooses

    (an index into its own array, or a key into a dictionary). The tree must not have cycles.
